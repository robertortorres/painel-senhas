# Variáveis vêm do arquivo .env (copie de .env.example). Nunca commite o .env.
services:

  nginx:
    image: nginx:1.27-alpine
    container_name: sga-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - painel
      - totem
      - atendimento
    networks:
      - sga-net

  api:
    build: ./api
    container_name: sga-api
    restart: unless-stopped
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      TZ: ${TZ:-America/Sao_Paulo}
      DB_HOST: mysqldb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-clinicasga}
      DB_USER: ${DB_USER:-sgaapp}
      DB_PASS: ${DB_PASS:?Defina DB_PASS no .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ADMIN_SENHA_INICIAL: ${ADMIN_SENHA_INICIAL:-}
      PRIORIDADE_A_CADA: ${PRIORIDADE_A_CADA:-0}
      LIMITE_SENHAS_MINUTO: ${LIMITE_SENHAS_MINUTO:-30}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    networks:
      - sga-net

  painel:
    build: ./painel
    container_name: sga-painel
    restart: unless-stopped
    networks:
      - sga-net

  totem:
    build: ./totem
    container_name: sga-totem
    restart: unless-stopped
    networks:
      - sga-net

  atendimento:
    build: ./atendimento
    container_name: sga-atendimento
    restart: unless-stopped
    networks:
      - sga-net

  mysqldb:
    image: mysql:8.0
    container_name: sga-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_NAME:-clinicasga}
      MYSQL_USER: ${DB_USER:-sgaapp}
      MYSQL_PASSWORD: ${DB_PASS:?Defina DB_PASS no .env}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - sga-mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sga-net

  # Ferramentas administrativas: só sobem com `docker compose --profile admin up -d`
  # e ficam presas ao localhost do servidor (acesse por túnel SSH ou VPN).
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: sga-phpmyadmin
    restart: unless-stopped
    profiles: ["admin"]
    ports:
      - "127.0.0.1:8082:80"
    environment:
      PMA_HOST: mysqldb
      PMA_PORT: 3306
    depends_on:
      - mysqldb
    networks:
      - sga-net

  portainer:
    image: portainer/portainer-ce:2.21.5
    container_name: sga-portainer
    restart: unless-stopped
    profiles: ["admin"]
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sga-portainer-data:/data
    networks:
      - sga-net

volumes:
  sga-mysql-data:
  sga-portainer-data:

networks:
  sga-net:
    driver: bridge
