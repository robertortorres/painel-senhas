<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atendimento — SGA</title>
<!-- Dependências servidas localmente: funciona mesmo sem internet -->
<script src="/vendor/vue.global.prod.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
[v-cloak]{display:none}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f1f5f9;font-family:'Segoe UI',sans-serif;min-height:100vh}
#app{display:flex;flex-direction:column;min-height:100vh}

/* NAV */
nav{background:#1e40af;color:#fff;padding:0 24px;display:flex;align-items:center;gap:16px;height:56px;flex-shrink:0}
nav h1{font-size:1.1rem;font-weight:700;flex:1}
nav .nav-item{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.9rem;opacity:.75;transition:.15s}
nav .nav-item:hover{opacity:1;background:rgba(255,255,255,.15)}
nav .nav-item.ativo{opacity:1;background:rgba(255,255,255,.2)}
.badge{background:#ef4444;color:#fff;border-radius:50px;padding:1px 7px;font-size:.75rem;margin-left:4px}

/* LOGIN */
#login-wrap{flex:1;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-card h2{text-align:center;margin-bottom:24px;color:#1e293b}
.campo{margin-bottom:16px}
.campo label{display:block;font-size:.85rem;color:#64748b;margin-bottom:4px}
.campo input{width:100%;padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:1rem;outline:none;transition:.15s}
.campo input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.btn-primario{width:100%;background:#2563eb;color:#fff;border:none;padding:12px;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600;transition:.15s}
.btn-primario:hover{background:#1d4ed8}
.erro-login{color:#ef4444;font-size:.85rem;text-align:center;margin-top:8px}

/* CONTEÚDO */
#conteudo{flex:1;padding:24px;max-width:1200px;width:100%;margin:0 auto}

/* PAINEL ATENDIMENTO */
.painel-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card h3{font-size:.85rem;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.numero-grande{font-size:4rem;font-weight:900;color:#1e293b;line-height:1}
.numero-grande.vazio{color:#cbd5e1;font-size:2rem}
.tag{display:inline-block;padding:3px 10px;border-radius:50px;font-size:.75rem;font-weight:600}
.tag.aguardando{background:#dbeafe;color:#1e40af}
.tag.chamada{background:#fef9c3;color:#854d0e}
.tag.atendimento{background:#dcfce7;color:#166534}
.tag.prioritario{background:#fef3c7;color:#92400e}

.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:.9rem;font-weight:500;transition:.15s}
.btn:active{opacity:.8}
.btn-verde{background:#22c55e;color:#fff}
.btn-azul{background:#3b82f6;color:#fff}
.btn-cinza{background:#e2e8f0;color:#475569}
.btn-vermelho{background:#ef4444;color:#fff}
.btn-amarelo{background:#f59e0b;color:#fff}

.select-local{padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:.9rem;outline:none;cursor:pointer}

/* FILA */
.fila-lista{display:flex;flex-direction:column;gap:8px}
.fila-item{background:#fff;border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:4px solid transparent}
.fila-item.aguardando{border-left-color:#3b82f6}
.fila-item.chamada{border-left-color:#f59e0b}
.fila-item.atendimento{border-left-color:#22c55e}
.fila-item .codigo{font-size:1.4rem;font-weight:900;min-width:72px;color:#1e293b}
.fila-item .info{flex:1}
.fila-item .info .setor{font-size:.9rem;color:#64748b}
.fila-item .info .tempo{font-size:.8rem;color:#94a3b8}
.fila-item .acoes{display:flex;gap:6px}

/* ABAS */
.abas{display:flex;gap:4px;margin-bottom:16px;background:#e2e8f0;padding:4px;border-radius:10px;width:fit-content}
.aba{padding:6px 18px;border-radius:7px;cursor:pointer;font-size:.9rem;color:#64748b;transition:.15s}
.aba.ativa{background:#fff;color:#1e293b;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ADMIN */
.tabela{width:100%;border-collapse:collapse}
.tabela th{text-align:left;padding:10px 12px;font-size:.8rem;color:#64748b;border-bottom:2px solid #e2e8f0;text-transform:uppercase;letter-spacing:.5px}
.tabela td{padding:10px 12px;border-bottom:1px solid #f1f5f9;font-size:.9rem}
.tabela tr:hover td{background:#f8fafc}
.form-linha{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.form-grupo{display:flex;flex-direction:column;gap:4px}
.form-grupo label{font-size:.8rem;color:#64748b}
.form-grupo input,.form-grupo select{padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:.9rem;outline:none}
.form-grupo input:focus,.form-grupo select:focus{border-color:#3b82f6}

.setores-check{display:flex;flex-wrap:wrap;gap:6px}
.setores-check label{display:flex;align-items:center;gap:4px;font-size:.85rem;background:#f1f5f9;padding:4px 10px;border-radius:50px;cursor:pointer}
.btn-pequeno{padding:4px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.aviso-conexao{background:#fef2f2;color:#b91c1c;text-align:center;padding:6px;font-size:.85rem}
tr.inativo td{color:#94a3b8}

@media(max-width:640px){.painel-grid{grid-template-columns:1fr}.form-linha{flex-direction:column}}
</style>
</head>
<body>
<div id="app" v-cloak>

  <!-- LOGIN -->
  <div id="login-wrap" v-if="!usuario">
    <div class="login-card">
      <h2>SGA — Atendimento</h2>
      <div class="campo">
        <label>Login</label>
        <input v-model="loginForm.login" type="text" placeholder="seu.login" autocomplete="username" @keyup.enter="fazerLogin">
      </div>
      <div class="campo">
        <label>Senha</label>
        <input v-model="loginForm.senha" type="password" placeholder="••••••••" autocomplete="current-password" @keyup.enter="fazerLogin">
      </div>
      <button class="btn-primario" @click="fazerLogin" :disabled="loginForm.carregando">
        {{ loginForm.carregando ? 'Entrando...' : 'Entrar' }}
      </button>
      <div class="erro-login" v-if="loginForm.erro">{{ loginForm.erro }}</div>
    </div>
  </div>

  <!-- APP PRINCIPAL -->
  <template v-if="usuario">
    <nav>
      <h1>SGA</h1>
      <span v-if="podeAtender" class="nav-item" :class="{ativo: aba==='atendimento'}" @click="aba='atendimento'">
        Atendimento
        <span class="badge" v-if="qtdAguardando > 0">{{ qtdAguardando }}</span>
      </span>
      <span v-if="podeAdmin" class="nav-item" :class="{ativo: aba==='admin'}" @click="aba='admin'; carregarAdmin()">
        Administrativo
      </span>
      <span style="font-size:.85rem;opacity:.7">{{ usuario.nome }}</span>
      <span class="nav-item" @click="sair">Sair</span>
    </nav>
    <div class="aviso-conexao" v-if="!conectado">Sem conexão em tempo real — reconectando...</div>

    <div id="conteudo">

      <div v-if="!podeAtender && !podeAdmin" class="card">
        Seu perfil ({{ usuario.perfil }}) não tem acesso ao atendimento.
      </div>

      <!-- ABA ATENDIMENTO -->
      <div v-if="aba==='atendimento' && podeAtender">
        <div class="painel-grid">
          <!-- Card senha atual -->
          <div class="card">
            <h3>Chamando agora</h3>
            <div v-if="senhaAtual">
              <div class="numero-grande" :style="senhaAtual.tipo==='prioritario'?'color:#f59e0b':''">
                {{ senhaAtual.codigo }}
              </div>
              <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                <span class="tag" :class="senhaAtual.status">{{ senhaAtual.status }}</span>
                <span class="tag prioritario" v-if="senhaAtual.tipo==='prioritario'">Prioritário</span>
                <span style="font-size:.9rem;color:#64748b">{{ senhaAtual.setor_nome }} · {{ senhaAtual.local_nome }}</span>
              </div>
              <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn btn-amarelo" @click="chamarNovamente" :disabled="ocupado" title="Chamar novamente">↻ Rechamar</button>
                <button class="btn btn-verde" @click="iniciarAtendimento" :disabled="ocupado" v-if="senhaAtual.status==='chamada'">Iniciar</button>
                <button class="btn btn-azul" @click="concluirAtendimento" :disabled="ocupado">Concluir</button>
                <button class="btn btn-cinza" @click="naoCompareceu" :disabled="ocupado" v-if="senhaAtual.status==='chamada'">Não compareceu</button>
              </div>
            </div>
            <div class="numero-grande vazio" v-else>—</div>
          </div>

          <!-- Card próxima -->
          <div class="card">
            <h3>Chamar próxima</h3>
            <div style="display:flex;flex-direction:column;gap:12px">
              <div class="form-grupo">
                <label>Local de atendimento</label>
                <select class="select-local" v-model="localSelecionado">
                  <option value="">Selecione...</option>
                  <option v-for="l in locais" :key="l.id" :value="l.id">{{ l.nome }}</option>
                </select>
              </div>
              <div class="form-grupo">
                <label>Setores que eu atendo (nenhum marcado = todos)</label>
                <div class="setores-check">
                  <label v-for="st in setores" :key="st.id">
                    <input type="checkbox" :value="st.id" v-model="setoresSelecionados"> {{ st.prefixo }} — {{ st.nome }}
                  </label>
                </div>
              </div>
              <button class="btn btn-verde" style="padding:12px" @click="chamarProxima"
                      :disabled="ocupado || !localSelecionado || !qtdAguardando">
                Chamar próxima senha
              </button>
              <div style="font-size:.85rem;color:#64748b">{{ qtdAguardando }} aguardando nos meus setores</div>
            </div>
          </div>
        </div>

        <!-- Fila -->
        <div class="abas">
          <div class="aba" :class="{ativa:abaFila==='aguardando'}" @click="abaFila='aguardando'">
            Aguardando <span class="badge">{{ qtdAguardando }}</span>
          </div>
          <div class="aba" :class="{ativa:abaFila==='chamada'}" @click="abaFila='chamada'">Chamados</div>
          <div class="aba" :class="{ativa:abaFila==='atendimento'}" @click="abaFila='atendimento'">Em atendimento</div>
        </div>

        <div class="fila-lista">
          <div class="fila-item" :class="s.status" v-for="s in filtraFila" :key="s.id">
            <div class="codigo" :style="s.tipo==='prioritario'?'color:#f59e0b':''">{{ s.codigo }}</div>
            <div class="info">
              <div>{{ s.setor_nome }}</div>
              <div class="setor">{{ s.local_nome || '—' }}</div>
              <div class="tempo">{{ formatarTempo(s.criado_em) }}</div>
            </div>
            <div class="acoes">
              <button class="btn btn-azul" @click="chamarSenha(s)" :disabled="ocupado" v-if="s.status==='aguardando'">Chamar</button>
              <button class="btn btn-vermelho" @click="cancelarSenha(s)" :disabled="ocupado" title="Cancelar">✕</button>
            </div>
          </div>
          <div v-if="!filtraFila.length" style="text-align:center;color:#94a3b8;padding:32px">Nenhuma senha nesta categoria</div>
        </div>
      </div>

      <!-- ABA ADMIN -->
      <div v-if="aba==='admin' && podeAdmin">
        <div class="abas">
          <div class="aba" :class="{ativa:abaAdmin==='setores'}" @click="abaAdmin='setores'">Setores</div>
          <div class="aba" :class="{ativa:abaAdmin==='locais'}" @click="abaAdmin='locais'">Locais</div>
          <div class="aba" :class="{ativa:abaAdmin==='usuarios'}" @click="abaAdmin='usuarios'">Usuários</div>
        </div>

        <!-- SETORES -->
        <div v-if="abaAdmin==='setores'">
          <div class="form-linha">
            <div class="form-grupo"><label>Nome</label><input v-model="novoSetor.nome" placeholder="Ex: Financeiro"></div>
            <div class="form-grupo"><label>Prefixo</label><input v-model="novoSetor.prefixo" placeholder="Ex: FI" maxlength="5" style="width:80px"></div>
            <div class="form-grupo"><label>Ordem</label><input v-model.number="novoSetor.ordem" type="number" style="width:80px"></div>
            <button class="btn btn-azul" @click="salvarSetor">Adicionar</button>
          </div>
          <table class="tabela">
            <thead><tr><th>ID</th><th>Nome</th><th>Prefixo</th><th>Ordem</th><th>Ativo</th><th></th></tr></thead>
            <tbody>
              <tr v-for="s in admin.setores" :key="s.id" :class="{inativo: !s.ativo}">
                <td>{{ s.id }}</td><td>{{ s.nome }}</td><td>{{ s.prefixo }}</td><td>{{ s.ordem }}</td>
                <td><span :style="s.ativo?'color:#22c55e':'color:#94a3b8'">{{ s.ativo ? 'Sim' : 'Não' }}</span></td>
                <td><button class="btn btn-pequeno" :class="s.ativo?'btn-vermelho':'btn-verde'" @click="alternarAtivo('setores', s)">{{ s.ativo ? 'Desativar' : 'Reativar' }}</button></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- LOCAIS -->
        <div v-if="abaAdmin==='locais'">
          <div class="form-linha">
            <div class="form-grupo"><label>Nome</label><input v-model="novoLocal.nome" placeholder="Ex: Guichê 01"></div>
            <button class="btn btn-azul" @click="salvarLocal">Adicionar</button>
          </div>
          <table class="tabela">
            <thead><tr><th>ID</th><th>Nome</th><th>Ativo</th><th></th></tr></thead>
            <tbody>
              <tr v-for="l in admin.locais" :key="l.id" :class="{inativo: !l.ativo}">
                <td>{{ l.id }}</td><td>{{ l.nome }}</td>
                <td><span :style="l.ativo?'color:#22c55e':'color:#94a3b8'">{{ l.ativo ? 'Sim' : 'Não' }}</span></td>
                <td><button class="btn btn-pequeno" :class="l.ativo?'btn-vermelho':'btn-verde'" @click="alternarAtivo('locais', l)">{{ l.ativo ? 'Desativar' : 'Reativar' }}</button></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- USUÁRIOS -->
        <div v-if="abaAdmin==='usuarios'">
          <div class="form-linha">
            <div class="form-grupo"><label>Nome</label><input v-model="novoUsuario.nome" placeholder="Nome completo"></div>
            <div class="form-grupo"><label>Login</label><input v-model="novoUsuario.login" placeholder="login"></div>
            <div class="form-grupo"><label>Senha (mín. 8)</label><input v-model="novoUsuario.senha" type="password" placeholder="••••••••" autocomplete="new-password"></div>
            <div class="form-grupo">
              <label>Perfil</label>
              <select v-model="novoUsuario.perfil">
                <option v-for="p in perfisDisponiveis" :key="p.valor" :value="p.valor">{{ p.nome }}</option>
              </select>
            </div>
            <button class="btn btn-azul" @click="salvarUsuario">Adicionar</button>
          </div>
          <table class="tabela">
            <thead><tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Ativo</th><th></th></tr></thead>
            <tbody>
              <tr v-for="u in admin.usuarios" :key="u.id" :class="{inativo: !u.ativo}">
                <td>{{ u.nome }}</td><td>{{ u.login }}</td><td>{{ u.perfil }}</td>
                <td><span :style="u.ativo?'color:#22c55e':'color:#94a3b8'">{{ u.ativo ? 'Sim' : 'Não' }}</span></td>
                <td style="display:flex;gap:6px">
                  <button class="btn btn-pequeno btn-cinza" @click="trocarSenhaUsuario(u)">Trocar senha</button>
                  <button v-if="u.id !== usuario.id" class="btn btn-pequeno" :class="u.ativo?'btn-vermelho':'btn-verde'" @click="alternarAtivo('usuarios', u)">{{ u.ativo ? 'Desativar' : 'Reativar' }}</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </template>
</div>

<script>
const { createApp } = Vue;

const PERFIS = [
  { valor: 'admin_global',  nome: 'Admin global', soGlobal: true },
  { valor: 'admin_unidade', nome: 'Admin unidade' },
  { valor: 'atendente',     nome: 'Atendente' },
  { valor: 'medico',        nome: 'Médico' },
  { valor: 'triagem',       nome: 'Triagem' },
  { valor: 'relatorios',    nome: 'Relatórios' },
];

createApp({
  data() {
    return {
      usuario: null, token: null,
      loginForm: { login: '', senha: '', carregando: false, erro: '' },
      aba: 'atendimento', abaFila: 'aguardando', abaAdmin: 'setores',
      fila: [], locais: [], setores: [], senhaAtual: null,
      localSelecionado: '', setoresSelecionados: [],
      socket: null, conectado: true, ocupado: false, agora: Date.now(),
      admin: { setores: [], locais: [], usuarios: [] },
      novoSetor: { nome: '', prefixo: '', ordem: 0 },
      novoLocal: { nome: '' },
      novoUsuario: { nome: '', login: '', senha: '', perfil: 'atendente' },
    };
  },
  computed: {
    podeAtender() { return ['atendente','medico','admin_unidade','admin_global'].includes(this.usuario?.perfil); },
    podeAdmin()   { return ['admin_unidade','admin_global'].includes(this.usuario?.perfil); },
    perfisDisponiveis() { return PERFIS.filter(p => !p.soGlobal || this.usuario?.perfil === 'admin_global'); },
    filaMinha() {
      if (!this.setoresSelecionados.length) return this.fila;
      return this.fila.filter(s => this.setoresSelecionados.includes(s.setor_id));
    },
    qtdAguardando() { return this.filaMinha.filter(s => s.status === 'aguardando').length; },
    filtraFila()    { return this.filaMinha.filter(s => s.status === this.abaFila); },
    chavePrefs()    { return `sga_prefs_${this.usuario?.id}`; },
  },
  watch: {
    localSelecionado() { this.salvarPrefs(); },
    setoresSelecionados() { this.salvarPrefs(); },
  },
  methods: {
    async api(path, opts = {}) {
      const headers = { 'Content-Type': 'application/json', ...opts.headers };
      if (this.token) headers.Authorization = 'Bearer ' + this.token;
      const r = await fetch(path, { ...opts, headers });
      const corpo = await r.json().catch(() => null);
      if (r.status === 401 && this.token) {
        this.sair();
        this.loginForm.erro = 'Sessão expirada. Entre novamente.';
      }
      if (!r.ok) throw new Error(corpo?.erro || `Erro ${r.status}`);
      return corpo;
    },
    // Executa uma ação mostrando o erro ao usuário e travando botões durante a chamada
    async executar(fn) {
      if (this.ocupado) return;
      this.ocupado = true;
      try { return await fn(); }
      catch (e) { if (this.usuario) alert(e.message); }
      finally { this.ocupado = false; }
    },

    // ---------- Sessão ----------
    async fazerLogin() {
      this.loginForm.carregando = true; this.loginForm.erro = '';
      try {
        const d = await this.api('/api/auth/login', {
          method: 'POST', body: JSON.stringify({ login: this.loginForm.login, senha: this.loginForm.senha }),
        });
        this.token = d.token;
        this.usuario = d.usuario;
        this.loginForm.senha = '';
        localStorage.setItem('sga_token', d.token);
        localStorage.setItem('sga_usuario', JSON.stringify(d.usuario));
        this.iniciar();
      } catch (e) {
        this.loginForm.erro = e.message || 'Erro ao fazer login';
      } finally { this.loginForm.carregando = false; }
    },
    async iniciar() {
      try {
        this.usuario = await this.api('/api/auth/me');   // valida o token salvo e atualiza perfil
      } catch { return; }
      if (!this.podeAtender && this.podeAdmin) this.aba = 'admin';
      this.carregarPrefs();
      this.conectarSocket();
      if (this.podeAtender) {
        await Promise.all([this.carregarFila(), this.carregarLocais(), this.carregarSetores(), this.carregarAtual()]).catch(() => {});
      }
      if (this.aba === 'admin') this.carregarAdmin();
    },
    sair() {
      localStorage.removeItem('sga_token'); localStorage.removeItem('sga_usuario');
      if (this.socket) { this.socket.disconnect(); this.socket = null; }
      this.usuario = null; this.token = null; this.senhaAtual = null; this.fila = [];
    },
    carregarPrefs() {
      try {
        const p = JSON.parse(localStorage.getItem(this.chavePrefs) || '{}');
        this.localSelecionado = p.local || '';
        this.setoresSelecionados = p.setores || [];
      } catch {}
    },
    salvarPrefs() {
      if (!this.usuario) return;
      localStorage.setItem(this.chavePrefs, JSON.stringify({ local: this.localSelecionado, setores: this.setoresSelecionados }));
    },

    // ---------- Dados ----------
    async carregarFila() {
      this.fila = await this.api(`/api/senhas/fila`);
      if (this.senhaAtual) {
        const s = this.fila.find(f => f.id === this.senhaAtual.id);
        if (s) this.senhaAtual = s; else this.senhaAtual = null; // concluída/cancelada em outro lugar
      }
    },
    async carregarAtual()  { this.senhaAtual = await this.api('/api/senhas/atual'); },
    async carregarLocais() {
      this.locais = await this.api(`/api/locais`);
      if (this.localSelecionado && !this.locais.some(l => l.id == this.localSelecionado)) this.localSelecionado = '';
    },
    async carregarSetores() {
      this.setores = await this.api(`/api/setores`);
      const ids = this.setores.map(s => s.id);
      this.setoresSelecionados = this.setoresSelecionados.filter(id => ids.includes(id));
    },
    conectarSocket() {
      let timer = null;
      const recarregar = () => {         // agrupa vários eventos seguidos em uma só requisição
        clearTimeout(timer);
        timer = setTimeout(() => this.podeAtender && this.carregarFila().catch(() => {}), 300);
      };
      this.socket = io();
      this.socket.on('connect', () => {
        this.conectado = true;
        this.socket.emit('join:unidade', { unidade_id: this.usuario.unidade_id });
        recarregar();                    // pega o que mudou enquanto estava desconectado
      });
      this.socket.on('disconnect', () => { this.conectado = false; });
      this.socket.on('senha:criada', recarregar);
      this.socket.on('fila:atualizada', recarregar);
    },

    // ---------- Atendimento ----------
    exigirLocal() {
      if (!this.localSelecionado) { alert('Selecione o local de atendimento'); return false; }
      return true;
    },
    chamarProxima() {
      if (!this.exigirLocal()) return;
      return this.executar(async () => {
        this.senhaAtual = await this.api('/api/senhas/proxima', {
          method: 'POST', body: JSON.stringify({ local_id: this.localSelecionado, setores: this.setoresSelecionados }),
        });
        await this.carregarFila();
      });
    },
    chamarSenha(s) {
      if (!this.exigirLocal()) return;
      return this.executar(async () => {
        this.senhaAtual = await this.api(`/api/senhas/${s.id}/chamar`, {
          method: 'POST', body: JSON.stringify({ local_id: this.localSelecionado }),
        });
        await this.carregarFila();
      });
    },
    chamarNovamente() {
      return this.executar(() => this.api(`/api/senhas/${this.senhaAtual.id}/rechamar`, { method: 'POST' }));
    },
    iniciarAtendimento() {
      return this.executar(async () => {
        this.senhaAtual = await this.api(`/api/senhas/${this.senhaAtual.id}/atender`, { method: 'POST' });
      });
    },
    concluirAtendimento() {
      return this.executar(async () => {
        await this.api(`/api/senhas/${this.senhaAtual.id}/concluir`, { method: 'POST' });
        this.senhaAtual = null;
        await this.carregarFila();
      });
    },
    naoCompareceu() {
      if (!confirm(`Marcar a senha ${this.senhaAtual.codigo} como não compareceu (cancelar)?`)) return;
      return this.executar(async () => {
        await this.api(`/api/senhas/${this.senhaAtual.id}/cancelar`, { method: 'POST' });
        this.senhaAtual = null;
        await this.carregarFila();
      });
    },
    cancelarSenha(s) {
      if (!confirm(`Cancelar senha ${s.codigo}?`)) return;
      return this.executar(async () => {
        await this.api(`/api/senhas/${s.id}/cancelar`, { method: 'POST' });
        if (this.senhaAtual?.id === s.id) this.senhaAtual = null;
        await this.carregarFila();
      });
    },
    formatarTempo(dt) {
      const diff = Math.floor((this.agora - new Date(dt)) / 60000);
      return diff < 1 ? 'agora' : diff < 60 ? `${diff} min` : `${Math.floor(diff/60)}h ${diff%60}min`;
    },

    // ---------- Administração ----------
    async carregarAdmin() {
      try {
        [this.admin.setores, this.admin.locais, this.admin.usuarios] = await Promise.all([
          this.api(`/api/setores?todos=1`),
          this.api(`/api/locais?todos=1`),
          this.api(`/api/usuarios?unidade_id=${this.usuario.unidade_id}`),
        ]);
      } catch (e) { alert(e.message); }
    },
    async depoisDeAlterarCadastro() {
      await this.carregarAdmin();
      if (this.podeAtender) await Promise.all([this.carregarLocais(), this.carregarSetores()]).catch(() => {});
    },
    salvarSetor() {
      return this.executar(async () => {
        await this.api('/api/setores', { method: 'POST', body: JSON.stringify(this.novoSetor) });
        this.novoSetor = { nome: '', prefixo: '', ordem: 0 };
        await this.depoisDeAlterarCadastro();
      });
    },
    salvarLocal() {
      return this.executar(async () => {
        await this.api('/api/locais', { method: 'POST', body: JSON.stringify(this.novoLocal) });
        this.novoLocal = { nome: '' };
        await this.depoisDeAlterarCadastro();
      });
    },
    salvarUsuario() {
      return this.executar(async () => {
        await this.api('/api/usuarios', { method: 'POST', body: JSON.stringify(this.novoUsuario) });
        this.novoUsuario = { nome: '', login: '', senha: '', perfil: 'atendente' };
        await this.depoisDeAlterarCadastro();
      });
    },
    alternarAtivo(recurso, item) {
      return this.executar(async () => {
        await this.api(`/api/${recurso}/${item.id}`, { method: 'PUT', body: JSON.stringify({ ativo: !item.ativo }) });
        await this.depoisDeAlterarCadastro();
      });
    },
    trocarSenhaUsuario(u) {
      const senha = prompt(`Nova senha para ${u.login} (mínimo 8 caracteres):`);
      if (!senha) return;
      return this.executar(async () => {
        await this.api(`/api/usuarios/${u.id}`, { method: 'PUT', body: JSON.stringify({ senha }) });
        alert('Senha alterada.');
      });
    },
  },
  mounted() {
    setInterval(() => { this.agora = Date.now(); }, 30000);
    const t = localStorage.getItem('sga_token');
    const u = localStorage.getItem('sga_usuario');
    if (t && u) {
      this.token = t;
      try { this.usuario = JSON.parse(u); } catch { this.sair(); return; }
      this.iniciar();
    }
  },
}).mount('#app');
</script>
</body>
</html>
