<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Senhas</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a1628;color:#fff;font-family:'Segoe UI',sans-serif;height:100vh;display:grid;grid-template-columns:1fr 340px;grid-template-rows:1fr 90px;overflow:hidden}

  /* ÁREA PRINCIPAL */
  #main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;gap:20px}
  #chamada-label{font-size:1.1rem;letter-spacing:4px;text-transform:uppercase;color:#94a3b8}
  #senha-codigo{font-size:9rem;font-weight:900;letter-spacing:8px;line-height:1;color:#fff;text-shadow:0 0 60px rgba(59,130,246,.6)}
  #senha-codigo.prioritario{color:#fbbf24;text-shadow:0 0 60px rgba(251,191,36,.6)}
  #senha-nome{font-size:2rem;color:#cbd5e1;margin-top:8px}
  #senha-local{font-size:1.4rem;background:#1e40af;color:#bfdbfe;padding:10px 32px;border-radius:50px;margin-top:16px}
  #sem-chamada{font-size:2rem;color:#475569;text-align:center}

  /* ANIMAÇÃO DE ENTRADA */
  @keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .pop{animation:popIn .4s cubic-bezier(.175,.885,.32,1.275)}

  /* HISTÓRICO */
  #sidebar{background:#0f1e38;border-left:1px solid #1e3a5f;display:flex;flex-direction:column}
  #sidebar-header{padding:16px;border-bottom:1px solid #1e3a5f;font-size:.8rem;letter-spacing:3px;text-transform:uppercase;color:#64748b}
  #historico{flex:1;overflow-y:auto;padding:8px}
  .hist-item{padding:12px 16px;border-bottom:1px solid #1e3a5f;display:flex;justify-content:space-between;align-items:center}
  .hist-item:first-child{background:#132040}
  .hist-codigo{font-size:1.4rem;font-weight:700;color:#93c5fd}
  .hist-codigo.prioritario{color:#fbbf24}
  .hist-local{font-size:.8rem;color:#64748b}

  /* RODAPÉ */
  #footer{background:#070e1c;border-top:1px solid #1e3a5f;display:flex;align-items:center;justify-content:center;font-size:1.6rem;letter-spacing:2px;color:#475569}
  #footer-sidebar{background:#070e1c;border-top:1px solid #1e3a5f;border-left:1px solid #1e3a5f;display:flex;align-items:center;justify-content:center;font-size:.9rem;color:#334155}

  #relogio{font-variant-numeric:tabular-nums}
  #footer-sidebar.offline{color:#f87171}

  /* ATIVAR SOM (navegador exige um toque antes de falar) */
  #ativar-som{position:fixed;inset:0;background:rgba(7,14,28,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;z-index:10}
  #ativar-som[hidden]{display:none}
  #ativar-som div:first-child{font-size:4rem}
  #ativar-som div:last-child{font-size:1.6rem;color:#cbd5e1}
</style>
</head>
<body>

<div id="main">
  <div id="sem-chamada">Aguardando chamada...</div>
  <div id="chamada-container" style="display:none;text-align:center">
    <div id="chamada-label">Senha chamada</div>
    <div id="senha-codigo" class="pop"></div>
    <div id="senha-nome"></div>
    <div id="senha-local"></div>
  </div>
</div>

<div id="sidebar">
  <div id="sidebar-header">Últimas chamadas</div>
  <div id="historico"></div>
</div>

<div id="footer"><span id="relogio"></span></div>
<div id="footer-sidebar">Conectando...</div>

<div id="ativar-som" hidden>
  <div>🔊</div>
  <div>Toque na tela para ativar o som</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const params     = new URLSearchParams(location.search);
const UNIDADE_ID = parseInt(params.get('unidade') || '1', 10);
// ?kiosk=1 quando o Chrome roda com --autoplay-policy=no-user-gesture-required
const KIOSK      = params.has('kiosk');
const MAX_HIST   = 8;
let historico    = [];
let nomeUnidade  = 'Sistema de Senhas';

const $ = id => document.getElementById(id);
const elCodigo = $('senha-codigo'), elNome = $('senha-nome'), elLocal = $('senha-local');
const elContainer = $('chamada-container'), elSem = $('sem-chamada');
const elHist = $('historico'), elRel = $('relogio'), elStatus = $('footer-sidebar');

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Relógio
const tick = () => { elRel.textContent = new Date().toLocaleTimeString('pt-BR'); };
tick(); setInterval(tick, 1000);

// ---------- Som ----------
let audioCtx = null;
function ativarSom() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  } catch {}
  $('ativar-som').hidden = true;
}
if (!KIOSK) {
  $('ativar-som').hidden = false;
  $('ativar-som').addEventListener('click', ativarSom);
} else {
  ativarSom();
}

function ding() {
  if (!audioCtx) return Promise.resolve();
  return new Promise(resolve => {
    const t = audioCtx.currentTime;
    [[880, 0], [660, 0.35]].forEach(([freq, atraso]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, t + atraso);
      g.gain.exponentialRampToValueAtTime(0.4, t + atraso + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + atraso + 0.5);
      o.connect(g).connect(audioCtx.destination);
      o.start(t + atraso); o.stop(t + atraso + 0.55);
    });
    setTimeout(resolve, 900);
  });
}

// Fila de anúncios: chamadas seguidas não se atropelam
const filaAnuncios = [];
let anunciando = false;
function falar(txt) {
  return new Promise(resolve => {
    if (!window.speechSynthesis) return resolve();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'pt-BR'; u.rate = 0.9; u.pitch = 1;
    u.onend = u.onerror = () => resolve();
    speechSynthesis.speak(u);
    setTimeout(resolve, 10000); // segurança se o onend não disparar
  });
}
async function processarAnuncios() {
  if (anunciando) return;
  anunciando = true;
  while (filaAnuncios.length) {
    const s = filaAnuncios.shift();
    const texto = `Senha ${String(s.codigo).split('').join(' ')}, ${s.setor_nome || ''}, ${s.local_nome || ''}`;
    await ding();
    await falar(texto);
    await new Promise(r => setTimeout(r, 800));
    await falar(texto);
  }
  anunciando = false;
}
function anunciar(s) {
  filaAnuncios.push(s);
  processarAnuncios();
}

// ---------- Tela ----------
function mostrarSenha(s) {
  elSem.style.display = 'none';
  elContainer.style.display = 'block';
  const classe = 'pop ' + (s.tipo === 'prioritario' ? 'prioritario' : '');
  elCodigo.className = '';
  elCodigo.textContent = s.codigo;
  elNome.textContent   = s.setor_nome || '';
  elLocal.textContent  = s.local_nome ? `Dirija-se ao ${s.local_nome}` : '';
  void elCodigo.offsetWidth; // reinicia a animação
  elCodigo.className = classe;
}

function renderHistorico() {
  elHist.innerHTML = historico.map(h => `
    <div class="hist-item">
      <span class="hist-codigo ${h.tipo === 'prioritario' ? 'prioritario' : ''}">${esc(h.codigo)}</span>
      <span class="hist-local">${esc(h.local_nome)}</span>
    </div>`).join('');
}

function adicionarHistorico(s) {
  historico = [s, ...historico.filter(h => h.id !== s.id)].slice(0, MAX_HIST);
  renderHistorico();
}

async function carregarUltimas() {
  try {
    const r = await fetch(`/api/publico/chamadas?unidade_id=${UNIDADE_ID}&limite=${MAX_HIST}`);
    if (!r.ok) return;
    historico = await r.json();
    renderHistorico();
    if (historico[0]) mostrarSenha(historico[0]);
  } catch {}
}

async function carregarUnidade() {
  try {
    const r = await fetch(`/api/publico/unidades/${UNIDADE_ID}`);
    if (r.ok) nomeUnidade = (await r.json()).nome;
  } catch {}
  if (!elStatus.classList.contains('offline')) elStatus.textContent = nomeUnidade;
}

// ---------- Socket.io ----------
const socket = io();
socket.on('connect', () => {
  // Reentra na sala a cada (re)conexão e recupera chamadas perdidas enquanto estava offline
  socket.emit('join:unidade', { unidade_id: UNIDADE_ID });
  elStatus.classList.remove('offline');
  elStatus.textContent = nomeUnidade;
  carregarUltimas();
});
socket.on('disconnect', () => {
  elStatus.classList.add('offline');
  elStatus.textContent = 'Sem conexão — reconectando...';
});
socket.on('senha:chamada', s => {
  mostrarSenha(s);
  adicionarHistorico(s);
  anunciar(s);
});

carregarUnidade();
</script>
</body>
</html>
