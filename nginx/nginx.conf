events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json;
  client_max_body_size 4m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Se houver um proxy na frente (ex.: Nginx Proxy Manager com HTTPS), repasse o esquema original
  map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  upstream api {
    server api:3001;
  }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_original;

    # API REST
    location /api/ {
      proxy_pass http://api;
    }

    # Socket.io (websocket)
    location /socket.io/ {
      proxy_pass         http://api;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_set_header   Host       $host;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 1h;
    }

    # Painel TV
    location = /painel { return 301 /painel/$is_args$args; }
    location /painel/ {
      proxy_pass http://painel:80/;
    }

    # Totem
    location = /totem { return 301 /totem/$is_args$args; }
    location /totem/ {
      proxy_pass http://totem:80/;
    }

    # Relatórios
    location = /relatorios { return 301 /relatorios/$is_args$args; }
    location /relatorios/ {
      proxy_pass http://relatorios:80/;
    }

    # Atendimento (raiz)
    location / {
      proxy_pass http://atendimento:80;
    }
  }
}
