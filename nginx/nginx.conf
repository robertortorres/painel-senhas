events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json;

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass         http://sga-api:3001;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
    }

    location /socket.io/ {
      proxy_pass         http://sga-api:3001;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
    }

    location /painel/ {
      proxy_pass http://sga-painel:80/;
      proxy_set_header Host $host;
    }

    location /totem/ {
      proxy_pass http://sga-totem:80/;
      proxy_set_header Host $host;
    }

    location /relatorios/ {
      proxy_pass http://sga-relatorios:80/;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://sga-atendimento:80;
      proxy_set_header Host $host;
    }
  }
}
