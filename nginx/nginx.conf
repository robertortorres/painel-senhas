events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json;
  client_max_body_size 1m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Se houver um proxy na frente (ex.: Nginx Proxy Manager com HTTPS), repasse o esquema original
  map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass         http://sga-api:3001;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
    }

    location /socket.io/ {
      proxy_pass         http://sga-api:3001;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_set_header   Host       $host;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 1h;
    }

    location /painel/ {
      proxy_pass http://sga-painel:80/;
      proxy_set_header Host $host;
    }

    location /totem/ {
      proxy_pass http://sga-totem:80/;
      proxy_set_header Host $host;
    }

    location /relatorios/ {
      proxy_pass http://sga-relatorios:80/;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://sga-atendimento:80;
      proxy_set_header Host $host;
    }
  }
}
