events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json;
  client_max_body_size 4m;

  # DNS interno do Docker. Os nomes dos serviços são consultados de novo a cada 10 s,
  # então um container recriado (com IP novo) volta a ser encontrado sozinho, sem 502
  # e sem precisar reiniciar o nginx. Também deixa o nginx subir mesmo com algum
  # serviço parado (ele responde 502 só para aquele serviço até ele voltar).
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Se houver um proxy na frente (ex.: Nginx Proxy Manager com HTTPS), repasse o esquema original
  map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  server {
    listen 80;
    server_name _;

    # Usar variáveis no proxy_pass é o que obriga o nginx a resolver o nome pelo resolver acima
    set $api         api:3001;
    set $painel      painel:80;
    set $totem       totem:80;
    set $atendimento atendimento:80;
    set $relatorios  relatorios:80;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_original;

    # API REST
    location /api/ {
      proxy_pass http://$api;
    }

    # Socket.io (websocket)
    location /socket.io/ {
      proxy_pass         http://$api;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_set_header   Host       $host;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 1h;
    }

    # Com variável no proxy_pass o nginx não troca o prefixo sozinho: o rewrite tira
    # /painel/, /totem/ e /relatorios/ do caminho antes de repassar (a query string é mantida)

    # Painel TV
    location = /painel { return 301 /painel/$is_args$args; }
    location /painel/ {
      rewrite ^/painel/(.*)$ /$1 break;
      proxy_pass http://$painel;
    }

    # Totem
    location = /totem { return 301 /totem/$is_args$args; }
    location /totem/ {
      rewrite ^/totem/(.*)$ /$1 break;
      proxy_pass http://$totem;
    }

    # Relatórios
    location = /relatorios { return 301 /relatorios/$is_args$args; }
    location /relatorios/ {
      rewrite ^/relatorios/(.*)$ /$1 break;
      proxy_pass http://$relatorios;
    }

    # Atendimento (raiz)
    location / {
      proxy_pass http://$atendimento;
    }
  }
}
